<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namealyzer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f7fa; --surface: #ffffff; --border: #dde1e6;
    --text: #1a1a2e; --text-muted: #6b7280;
    --primary: #4f46e5; --primary-hover: #4338ca;
    --success: #10b981;
    --tag-reversed: #fef3c7; --tag-reversed-text: #92400e;
    --tag-caps: #fce7f3; --tag-caps-text: #9d174d;
    --tag-data: #fee2e2; --tag-data-text: #991b1b;
    --tag-format: #f3e8ff; --tag-format-text: #6b21a8;
    --tag-duplicate: #ccfbf1; --tag-duplicate-text: #065f46;
    --tag-initial: #fff7ed; --tag-initial-text: #9a3412;
    --tag-spelling: #fdf2f8; --tag-spelling-text: #831843;
    --tag-accents: #ecfdf5; --tag-accents-text: #065f46;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
  .container { max-width: 1280px; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.25rem; }
  .subtitle { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
  textarea { width: 100%; min-height: 160px; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.9rem; resize: vertical; line-height: 1.6; }
  textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .btn-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
  button { padding: 0.5rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  button:hover { background: var(--bg); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
  .btn-success:hover { opacity: 0.9; }
  .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-muted); }
  .stats span { white-space: nowrap; }
  .stats strong { color: var(--text); }
  .results-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  .results-table th { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 2px solid var(--border); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); }
  .results-table td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .results-table tr:last-child td { border-bottom: none; }
  .results-table tr:hover td { background: #f9fafb; }
  .row-clean td { opacity: 0.55; }
  .original-name { color: var(--text-muted); font-size: 0.8rem; }
  .name-input { width: 100%; padding: 0.35rem 0.5rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.875rem; font-family: inherit; }
  .name-input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; }
  .tag { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
  .tag-reversed { background: var(--tag-reversed); color: var(--tag-reversed-text); }
  .tag-caps { background: var(--tag-caps); color: var(--tag-caps-text); }
  .tag-data { background: var(--tag-data); color: var(--tag-data-text); }
  .tag-format { background: var(--tag-format); color: var(--tag-format-text); }
  .tag-duplicate { background: var(--tag-duplicate); color: var(--tag-duplicate-text); }
  .tag-initial { background: var(--tag-initial); color: var(--tag-initial-text); }
  .tag-spelling { background: var(--tag-spelling); color: var(--tag-spelling-text); }
  .tag-accents { background: var(--tag-accents); color: var(--tag-accents-text); }
  .action-btns { display: flex; gap: 0.3rem; }
  .action-btns button { padding: 0.25rem 0.5rem; font-size: 0.75rem; border-radius: 4px; }
  .filter-bar { display: flex; gap: 0.25rem; flex-wrap: wrap; margin-bottom: 0.75rem; align-items: center; }
  .filter-bar .sep { width: 1px; height: 1.2rem; background: var(--border); margin: 0 0.25rem; }
  .filter-btn { padding: 0.15rem 0.5rem; font-size: 0.72rem; border-radius: 20px; white-space: nowrap; }
  .filter-btn .count { opacity: 0.7; }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
  .action-bar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 0.75rem 1.25rem; display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; z-index: 10; border-radius: 0 0 10px 10px; box-shadow: 0 -2px 8px rgba(0,0,0,0.05); }
  .issue-detail { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
  .conf-cell { text-align: center; font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  @media (max-width: 768px) {
    .results-table th:nth-child(5), .results-table td:nth-child(5) { display: none; }
    .results-table th:nth-child(3), .results-table td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Namealyzer</h1>
  <p class="subtitle">The proper name anomaly finder</p>
  <div class="card">
    <h2>Input Names</h2>
    <div id="dropZone" style="position:relative;">
      <textarea id="nameInput" placeholder="Paste CSV data: F_Name, L_Name, user_full_name&#10;&#10;John,Smith,John Smith&#10;Jane,Doe,Jane Marie Doe&#10;&#10;Or drag and drop a .csv file here"></textarea>
      <div id="dropOverlay" style="display:none; position:absolute; inset:0; background:rgba(79,70,229,0.08); border:2px dashed var(--primary); border-radius:6px; pointer-events:none; align-items:center; justify-content:center; font-size:1rem; color:var(--primary); font-weight:600;">Drop CSV file here</div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="analyze()">Analyze Names</button>
      <label style="padding:0.5rem 1rem; border:1px solid var(--border); border-radius:6px; background:var(--surface); font-size:0.875rem; font-weight:500; cursor:pointer; transition:all 0.15s;">
        Load File
        <input type="file" accept=".csv,.txt,.tsv" onchange="loadFile(event)" style="display:none;" />
      </label>
      <button onclick="loadSample()">Load Sample</button>
      <button onclick="clearAll()">Clear</button>
    </div>
  </div>
  <div id="resultsSection" style="display:none">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.75rem;">
        <h2 style="margin:0;">Results</h2>
        <div class="stats" id="stats"></div>
      </div>
      <div class="filter-bar" id="filterBar"></div>
      <div style="overflow-x:auto;">
        <table class="results-table">
          <thead><tr>
            <th style="width:12%">F_Name</th>
            <th style="width:12%">L_Name</th>
            <th style="width:18%">Full Name</th>
            <th style="width:22%">Issues</th>
            <th style="width:16%">Suggested Fix</th>
            <th style="width:14%">Actions</th>
            <th style="width:6%">Score</th>
          </tr></thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>
    <div id="dismissedBar" class="card" style="display:none; padding:0.75rem 1.25rem;">
      <span id="dismissedCount" style="font-size:0.85rem; color:var(--text-muted);"></span>
      <button onclick="undoAllDismissed()" style="font-size:0.8rem; padding:0.2rem 0.6rem; margin-left:0.5rem;">Undo All</button>
    </div>
    <div id="actionBar" class="action-bar" style="display:none;">
      <button onclick="acceptAllSuggestions()">Accept All Suggestions</button>
      <button onclick="copyToClipboard(this)">Copy to Clipboard</button>
      <button class="btn-success" onclick="exportCSV()">Export CSV</button>
      <button class="btn-success" onclick="exportTxt()">Export Text</button>
    </div>
  </div>
</div>

  reversed:  { label: 'Possibly Reversed', cls: 'tag-reversed', confidence: 'medium' },
  caps:      { label: 'Capitalization', cls: 'tag-caps', confidence: 'high' },
  data:      { label: 'Data Error', cls: 'tag-data', confidence: 'high' },
  format:    { label: 'Unusual Format', cls: 'tag-format', confidence: 'low' },
  duplicate: { label: 'Duplicate', cls: 'tag-duplicate', confidence: 'high' },
  neardupe:  { label: 'Near Duplicate', cls: 'tag-duplicate', confidence: 'medium' },
  initial:   { label: 'Single Initial', cls: 'tag-initial', confidence: 'low' },
  spelling:  { label: 'Possible Typo', cls: 'tag-spelling', confidence: 'low' },
  title:     { label: 'Has Title/Honorific', cls: 'tag-format', confidence: 'high' },
  merged:    { label: 'Merged Entry', cls: 'tag-data', confidence: 'high' },
  truncated: { label: 'Possibly Truncated', cls: 'tag-data', confidence: 'medium' },
  listformat: { label: 'Format Outlier', cls: 'tag-format', confidence: 'medium' },
  listswapped: { label: 'Swapped (confirmed)', cls: 'tag-reversed', confidence: 'high' },
  xfield_missing: { label: 'Name Part Missing', cls: 'tag-data', confidence: 'high' },
  xfield_mismatch: { label: 'Fields Mismatch', cls: 'tag-data', confidence: 'high' },
  xfield_swapped: { label: 'F/L Names Swapped', cls: 'tag-reversed', confidence: 'high' },
  xfield_extra: { label: 'Extra in Full Name', cls: 'tag-format', confidence: 'low' },
  accents:   { label: 'Accented Characters', cls: 'tag-accents', confidence: 'low' },
};

// Per-issue confidence can be overridden by detection logic
// high = almost certainly an error, medium = likely, low = review recommended
// Returns a confidence score from 1 (low) to 10 (certain error)
function getConfidence(issueType, detail) {
  if (issueType === 'data') {
    if (detail && detail.includes('Placeholder')) return 10;
    if (detail && detail.includes('invisible')) return 9;
    if (detail && detail.includes('formula')) return 9;
    if (detail && detail.includes('Concatenated')) return 8;
    if (detail && detail.includes('numbers')) return 8;
    if (detail && detail.includes('Repeated name part')) return 6;
    return 8;
  }
  if (issueType === 'caps') {
    if (detail && detail.includes('ALL CAPS')) return 9;
    if (detail && detail.includes('all lowercase')) return 9;
    if (detail && detail.includes('Inverted')) return 9;
    if (detail && detail.includes('Uncapitalized')) return 6;
    return 6;
  }
  if (issueType === 'reversed') {
    if (detail && detail.includes('Last, First')) return 8;
    if (detail && detail.includes('family-name-first')) return 3;
    return 5;
  }
  if (issueType === 'duplicate') return 9;
  if (issueType === 'neardupe') return 5;
  if (issueType === 'title') return 8;
  if (issueType === 'merged') return 9;
  if (issueType === 'truncated') return 5;
  if (issueType === 'initial') return 3;
  if (issueType === 'spelling') return 3;
  if (issueType === 'format') return 2;
  if (issueType === 'accents') return 2;
  if (issueType === 'listformat') return 5;
  if (issueType === 'listswapped') return 9;
  if (issueType === 'xfield_missing') return 8;
  if (issueType === 'xfield_mismatch') return 8;
  if (issueType === 'xfield_swapped') return 9;
  if (issueType === 'xfield_extra') return 2;
  return 3;
}

function scoreColor(score) {
  if (score >= 8) return '#dc2626';
  if (score >= 5) return '#f59e0b';
  return '#6b7280';

// ========== DETECTION ENGINE ==========

function parseCSVLine(line) {
  // Handle quoted CSV fields: "Smith, Jr.",John,"John Smith, Jr."
  // Also handles escaped quotes: "Smith""Jr" → Smith"Jr
  const fields = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i + 1] === '"') { current += '"'; i++; continue; } // escaped ""
      inQuotes = !inQuotes; continue;
    }
    if ((ch === ',' || ch === '\t') && !inQuotes) { fields.push(current.trim()); current = ''; continue; }
    current += ch;
  }
  fields.push(current.trim());
  return fields;
}

function crossFieldCheck(fName, lName, fullName) {
  const issues = [];
  const details = [];
  const fLo = fName.toLowerCase().trim();
  const lLo = lName.toLowerCase().trim();
  const fullLo = fullName.toLowerCase().trim();
  const fullParts = fullLo.split(/\s+/);

  // Handle missing fields explicitly
  if (!fullLo) {
    if (fLo || lLo) {
      issues.push('xfield_missing');
      details.push('Full name field is empty (F_Name: "' + fName + '", L_Name: "' + lName + '")');
    }
    return { issues, details };
  }
  if (!fLo && !lLo) return { issues, details }; // only full name, nothing to compare
  if (!fLo) {
    if (!fullLo.includes(lLo)) {
      issues.push('xfield_missing');
      details.push('F_Name is empty and L_Name "' + lName + '" not found in full name');
    } else {
      issues.push('xfield_missing');
      details.push('F_Name field is empty');
    }
    return { issues, details };
  }
  if (!lLo) {
    if (!fullLo.includes(fLo)) {
      issues.push('xfield_missing');
      details.push('L_Name is empty and F_Name "' + fName + '" not found in full name');
    } else {
      issues.push('xfield_missing');
      details.push('L_Name field is empty');
    }
    return { issues, details };
  }

  const fullContainsFirst = fullParts.some(p => p === fLo || fullLo.includes(fLo));
  const fullContainsLast = fullParts.some(p => p === lLo || fullLo.includes(lLo));

  // Check if F/L names are swapped: full name contains last name first, or F_Name matches common last names
  const fullStartsWithLast = fullParts[0] === lLo || fullLo.startsWith(lLo);
  const fullEndsWithFirst = fullParts[fullParts.length - 1] === fLo;
  if (fullContainsFirst && fullContainsLast && fullStartsWithLast && fullEndsWithFirst && fLo !== lLo) {
    issues.push('xfield_swapped');
    details.push('F_Name "' + fName + '" and L_Name "' + lName + '" appear swapped (full name: "' + fullName + '")');
    return { issues, details };
  }

  // Check if fields are swapped: F_Name looks like a surname, L_Name looks like a given name
  if (COMMON_LAST.has(fLo) && COMMON_FIRST.has(lLo) && !COMMON_FIRST.has(fLo) && fullContainsFirst && fullContainsLast) {
    issues.push('xfield_swapped');
    details.push('F_Name "' + fName + '" looks like a surname, L_Name "' + lName + '" looks like a given name');
    return { issues, details };
  }

  // Missing parts
  if (!fullContainsFirst && !fullContainsLast) {
    issues.push('xfield_mismatch');
    details.push('Full name "' + fullName + '" doesn\'t contain F_Name "' + fName + '" or L_Name "' + lName + '"');
  } else if (!fullContainsFirst) {
    issues.push('xfield_missing');
    details.push('F_Name "' + fName + '" not found in full name "' + fullName + '"');
  } else if (!fullContainsLast) {
    issues.push('xfield_missing');
    details.push('L_Name "' + lName + '" not found in full name "' + fullName + '"');
  }

  // Extra parts in full name (not an error, just informational)
  if (fullContainsFirst && fullContainsLast && issues.length === 0) {
    const expectedParts = (fName + ' ' + lName).toLowerCase().split(/\s+/);
    const extraParts = fullParts.filter(p => !expectedParts.includes(p) && !SINGLE_PARTICLES.has(p));
    if (extraParts.length > 0) {
      issues.push('xfield_extra');
      details.push('Full name has extra parts: "' + extraParts.join(', ') + '" (middle name, suffix, etc.)');
    }
  }

  return { issues, details };
}

function analyze() {
  const raw = document.getElementById('nameInput').value;
  if (!raw.trim()) return;

  const lines = raw.split('\n').filter(l => l.trim().length > 0);

  // Skip header row if it looks like one
  let startIdx = 0;
  if (lines.length > 1) {
    const firstFields = parseCSVLine(lines[0]);
    const headerish = firstFields.some(f => /^(f_?name|l_?name|first|last|full|user)/i.test(f.replace(/\s+/g, '')));
    if (headerish) startIdx = 1;
  }

  const dataLines = lines.slice(startIdx);

  entries = dataLines.map((line, i) => {
    const fields = parseCSVLine(line);
    const fName = (fields[0] || '').trim();
    const lName = (fields[1] || '').trim();
    const name = (fields[2] || '').trim() || (fName + ' ' + lName).trim(); // fallback to concat

    const issues = detectIssues(name);
    const NO_AUTOFIX = ['data', 'merged', 'truncated'];
    const suggestion = issues.length > 0 && !issues.some(ii => NO_AUTOFIX.includes(ii)) ? suggestFix(name) : '';

    const entry = {
      id: i,
      original: name,
      current: name.replace(/\t/g, ' ').replace(/^"|"$/g, '').replace(/\s+/g, ' ').trim(),
      fName: fName,
      lName: lName,
      issues: issues,
      details: issues.map(iss => issueDetail(iss, name)),
      suggestion: suggestion,
      accepted: false,
      dismissed: false,
    };

    // Cross-field validation (also detects missing fields)
    if (fName || lName || entry.current) {
      const xf = crossFieldCheck(fName, lName, entry.current);
      entry.issues.push(...xf.issues);
      entry.details.push(...xf.details);
    }

    return entry;
  });

  markDuplicates(); markListContext();
  render();
  document.getElementById('resultsSection').style.display = '';
  document.getElementById('actionBar').style.display = '';
}

function issueDetail(issueType, name) {
  // Clean version for analysis (strip quotes, tabs)
  const clean = name.replace(/^"|"$/g, '').replace(/\t/g, ' ').trim();
  switch(issueType) {
    case 'caps':
      const cParts = clean.split(/\s+/).filter(p => p.length > 1 && !SINGLE_PARTICLES.has(p.toLowerCase()));
      if (cParts.length === 0) return 'Mixed capitalization';
      if (cParts.every(p => p === p.toUpperCase() && /[A-Z]/.test(p))) return 'ALL CAPS';
      if (cParts.every(p => p === p.toLowerCase())) return 'all lowercase';
      if (cParts.some(p => p.length > 1 && p[0] === p[0].toLowerCase() && /[A-Z]/.test(p.slice(1)))) return 'Inverted case';
      if (cParts.some(p => p.length > 1 && p[0] === p[0].toLowerCase())) return 'Uncapitalized name part';
      return 'Mixed capitalization';
    case 'data':
      if (/\d/.test(clean)) return 'Contains numbers';
      if (PLACEHOLDERS.has(clean.toLowerCase())) return 'Placeholder entry';
      if (/\xC3[\x80-\xBF]/.test(clean)) return 'Possible encoding issue (mojibake)';
      if (/[\u200B\u200C\u200D\uFEFF\u00AD]/.test(name)) return 'Contains invisible characters (zero-width/BOM)';
      if (/^[=+\-@]/.test(clean)) return 'Starts with formula character (spreadsheet artifact)';
      if (clean.split(/\s+/).some(t => /^[A-Z][a-z]+[A-Z][a-z]+$/.test(t) && t.length > 6)) return 'Possible concatenated names (no space between)';
      if (/[<>@#$%^&*=+{}\[\]|\\~`]/.test(clean)) return 'Contains special characters';
      const dParts = clean.split(/\s+/).map(p => p.replace(/[^a-zA-Z\u00C0-\u024F'-]/g, '').toLowerCase()).filter(p => p.length > 1);
      const dSeen = new Set();
      for (const p of dParts) { if (dSeen.has(p)) return 'Repeated name part: "' + p + '"'; dSeen.add(p); }
      return 'Data entry error';
    case 'initial':
      return 'Single-letter initial(s) — may be truncated';
    case 'spelling':
      return 'Unusual letter pattern — verify spelling';
    case 'reversed':
      if (/,/.test(name)) return '"Last, First" format detected';
      const rTokens = name.trim().split(/\s+/).filter(t => !SINGLE_PARTICLES.has(t.toLowerCase()));
      if (rTokens.length >= 1 && FAMILY_FIRST_SURNAMES.has(rTokens[0].toLowerCase())) {
        return 'Possible family-name-first order (East Asian/Hungarian convention)';
      }
      return 'Name parts may be reversed';
    case 'format':
      if (/\b[SDW]\/O\b/i.test(name)) return 'Contains S/O, D/O, or W/O (formal record pattern)';
      if (/\(.*\)/.test(name)) return 'Contains parenthetical (nickname?)';
      const tparts = name.trim().split(/\s+/);
      if (tparts.some(p => p === p.toUpperCase() && p.length > 1 && /[A-Z]/.test(p)) &&
          tparts.some(p => p !== p.toUpperCase() && p.length > 1)) return 'Mixed: some parts ALL CAPS';
      return 'Unusual formatting';
    case 'title':
      const titleMatch = clean.split(/\s+/)[0];
      return 'Contains title/honorific: "' + titleMatch + '"';
    case 'merged':
      return 'Possible two people in one entry (contains "&" or "and")';
    case 'truncated':
      return 'Name may be truncated (' + clean.length + ' chars, ends abruptly)';
    case 'accents':
      return 'Contains accented characters — can be normalized to English';
    case 'xfield_missing':
      return 'First or last name missing from full name';
    case 'xfield_mismatch':
      return 'Full name doesn\'t match first/last name fields';
    case 'xfield_swapped':
      return 'First and last name fields appear swapped';
    case 'xfield_extra':
      return 'Full name has additional parts not in first/last fields';
    default: return '';
  }
}

function detectIssues(name) {
  const issues = [];
  const trimmed = name.replace(/^"|"$/g, '').replace(/\t/g, ' ').trim();
  const lower = trimmed.toLowerCase();

  // Placeholder detection
  if (PLACEHOLDERS.has(lower)) { issues.push('data'); return issues; }

  // Data errors
  if (/\d/.test(trimmed)) issues.push('data');
  if (/[<>@#$%^&*=+{}\[\]|\\~`]/.test(trimmed)) issues.push('data');
  if (/\xC3[\x80-\xBF]/.test(trimmed)) issues.push('data'); // mojibake
  if (/[\u200B\u200C\u200D\uFEFF\u00AD]/.test(name)) issues.push('data'); // invisible chars
  if (/^[=+\-@]/.test(trimmed)) issues.push('data'); // spreadsheet formula injection
  // Concatenated names: "JohnSmith" — lowercase followed by uppercase mid-word
  if (trimmed.split(/\s+/).some(t => /^[A-Z][a-z]+[A-Z][a-z]+$/.test(t) && t.length > 6)) issues.push('data');
  // S/O, D/O, W/O formal records
  if (/\b[SDW]\/O\b/i.test(trimmed)) issues.push('format');

  // Extract alpha parts for analysis
  const tokens = trimmed.split(/\s+/).filter(Boolean);
  const alphaParts = tokens.map(t => t.replace(/[^a-zA-Z\u00C0-\u024F'-]/g, '')).filter(Boolean);

  // Capitalization checks (skip particles and single chars)
  const significantParts = alphaParts.filter(p => p.length > 1 && !SINGLE_PARTICLES.has(p.toLowerCase()));
  if (significantParts.length > 0) {
    const allLower = significantParts.every(p => p === p.toLowerCase());
    const allUpper = significantParts.every(p => p === p.toUpperCase());
    const invertedCase = significantParts.some(p =>
      p.length > 1 && p[0] === p[0].toLowerCase() && p[0] !== p[0].toUpperCase() &&
      p.slice(1).split('').some(c => c === c.toUpperCase() && c !== c.toLowerCase())
    );
    // Check for uncapitalized name parts: "svetoslav Dzhonev" — first part not capitalized
    const hasUncapitalized = significantParts.some(p =>
      p.length > 1 && p[0] === p[0].toLowerCase() && p[0] !== p[0].toUpperCase()
    );
    if (allLower) issues.push('caps');
    else if (allUpper) issues.push('caps');
    else if (invertedCase) issues.push('caps');
    else if (hasUncapitalized) issues.push('caps');
  }

  // Single initial detection (but not if it's a known particle)
  const hasLoneInitial = tokens.some(t => {
    const clean = t.replace(/[^a-zA-Z]/g, '');
    return clean.length === 1 && !SINGLE_PARTICLES.has(clean.toLowerCase());
  });
  if (hasLoneInitial) issues.push('initial');

  // Unusual format: parenthetical nicknames
  if (/\(.*\)/.test(trimmed)) issues.push('format');

  // Mixed ALL-CAPS parts with normal parts (separator style)
  if (!issues.includes('caps') && significantParts.length >= 2) {
    const hasUpper = significantParts.some(p => p === p.toUpperCase() && p.length > 1 && /[A-Z]/.test(p));
    const hasNormal = significantParts.some(p => p !== p.toUpperCase() && p.length > 1);
    if (hasUpper && hasNormal) issues.push('format');
  }

  // Reversed name: "Last, First" format
  if (/^[A-Za-z\u00C0-\u024F'-]+\s*,\s*[A-Za-z\u00C0-\u024F'-]/.test(trimmed)) {
    issues.push('reversed');
  }

  // Reversed name: heuristic using name frequency
  if (!issues.includes('reversed') && alphaParts.length >= 2) {
    // Filter out particles for analysis
    const nonParticle = alphaParts.filter(p => !SINGLE_PARTICLES.has(p.toLowerCase()));
    if (nonParticle.length >= 2) {
      const first = nonParticle[0].toLowerCase();
      const last = nonParticle[nonParticle.length - 1].toLowerCase();

      // Classic 2-part reversal: "Smith John" where Smith is a known surname, John is a known given name
      if (COMMON_LAST.has(first) && COMMON_FIRST.has(last) && !COMMON_FIRST.has(first)) {
        issues.push('reversed');
      }

      // East Asian / Hungarian style: first token is a known family-name-first surname
      // and the remaining parts look like given names (not also surnames)
      if (!issues.includes('reversed') && FAMILY_FIRST_SURNAMES.has(first)) {
        const restAreSurnames = nonParticle.slice(1).every(p => FAMILY_FIRST_SURNAMES.has(p.toLowerCase()));
        if (!restAreSurnames) {
          issues.push('reversed');
        }
      }
    }
  }

  // Repeated name parts within a single entry (e.g. "Fekri M Wa'el M Fekri Zaid Alkilani")
  if (alphaParts.length >= 4) {
    const lowerParts = alphaParts.map(p => p.toLowerCase()).filter(p => p.length > 1);
    const seen = new Set();
    for (const p of lowerParts) {
      if (seen.has(p)) { issues.push('data'); break; }
      seen.add(p);
    }
  }

  // Names with accented/special characters that could be normalized to English
  if (/[^\x00-\x7F]/.test(trimmed)) {
    const hasDiacritics = trimmed !== trimmed.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const hasSpecial = /[øØæÆßðÐþÞłŁđĐ]/.test(trimmed);
    if (hasDiacritics || hasSpecial) issues.push('accents');
  }

  // Possible typo: excessive consecutive consonants (language-aware)
  const vowels = 'aeiouyàáâãäåèéêëìíîïòóôõöùúûüýÿ';
  for (const part of alphaParts) {
    if (part.length < 4) continue;
    const lo = part.toLowerCase();
    // Check for 4+ consonants in a row
    let maxConsonants = 0, run = 0;
    for (const ch of lo) {
      if (vowels.includes(ch) || ch === "'" || ch === '-') { run = 0; } else { run++; }
      maxConsonants = Math.max(maxConsonants, run);
    }
    if (maxConsonants >= 5) {
      // Check against known valid clusters
      const hasValidCluster = VALID_CLUSTERS.some(cl => lo.includes(cl));
      if (!hasValidCluster && !issues.includes('spelling')) issues.push('spelling');
    }
    // Triple repeated character
    if (/(.)\1\1/.test(lo) && !issues.includes('spelling')) issues.push('spelling');
  }

  // Titles/honorifics that shouldn't be in a name list
  // Titles/honorifics — require period (Hon. not Hon, Dr. not Dr) to avoid
  // false positives on given names like Hon, Mai, Sir
  const TITLES = /^(mr|mrs|ms|miss|dr|prof|sir|lady|rev|father|mother|fr|sr|sra|herr|frau|senor|senora|hon|judge|captain|capt|sgt|cpl|pvt|lt|col|maj|gen|adm)\.$/i;
  if (tokens.length >= 2 && TITLES.test(tokens[0])) {
    issues.push('title');
  }

  // Merged entries: two people in one field
  if (/(&|\band\b)/i.test(trimmed)) {
    issues.push('merged');
  }

  // Possible truncation: name has trailing whitespace in the raw input
  // (strongly suggests it was cut off mid-entry by a field-length limit)
  if (trimmed.length >= 10) {
    const rawTrimEnd = name.replace(/^"|"$/g, '').replace(/\t/g, ' ');
    if (rawTrimEnd.length > trimmed.length && /\s$/.test(rawTrimEnd)) {
      issues.push('truncated');
    }
  }

  // All-initials entry: "J.S." or "R.K.M."
  if (/^([A-Z]\.?\s*){2,}$/.test(trimmed) && trimmed.replace(/[^A-Z]/g, '').length <= 5) {
    if (!issues.includes('initial')) issues.push('initial');
  }

  return [...new Set(issues)];
}

// Levenshtein distance for fuzzy matching
function editDistance(a, b) {
  if (a.length === 0) return b.length;
  if (b.length === 0) return a.length;
  const matrix = [];
  for (let i = 0; i <= b.length; i++) matrix[i] = [i];
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      const cost = a[j - 1] === b[i - 1] ? 0 : 1;
      matrix[i][j] = Math.min(
        matrix[i - 1][j] + 1,
        matrix[i][j - 1] + 1,
        matrix[i - 1][j - 1] + cost
      );
    }
  }
  return matrix[b.length][a.length];
}

function markDuplicates() {
  // Normalize: lowercase, strip diacritics, European romanization, collapse non-alpha
  const normalize = s => s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/ø/g,'o').replace(/æ/g,'ae').replace(/ß/g,'ss')
    .replace(/ð/g,'d').replace(/þ/g,'th').replace(/ł/g,'l')
    .replace(/[''ʼ\u2019\u2018]/g, "'")
    .replace(/[\u200B\u200C\u200D\uFEFF\u00AD]/g, '')
    .replace(/\u00A0/g, ' ')
    .replace(/[^a-z]/g, '');

  const norms = entries.map(e => normalize(e.current));
  const active = entries.map((e, i) => !e.dismissed && norms[i].length > 0);

  // Use a Map for O(n) exact duplicate detection (handles 3+ dupes)
  const normMap = new Map();
  for (let i = 0; i < entries.length; i++) {
    if (!active[i]) continue;
    const key = norms[i];
    if (!normMap.has(key)) { normMap.set(key, []); }
    normMap.get(key).push(i);
  }
  for (const indices of normMap.values()) {
    if (indices.length < 2) continue;
    for (const i of indices) {
      const others = indices.filter(j => j !== i);
      if (!entries[i].issues.includes('duplicate')) {
        entries[i].issues.push('duplicate');
        entries[i].details.push('Same name as row(s) ' + others.map(j => j + 1).join(', '));
      }
    }
  }

  // Skip fuzzy matching for large lists (O(n²) Levenshtein is too slow)
  if (entries.length > 300) return;

  for (let i = 0; i < entries.length; i++) {
    if (!active[i]) continue;
    for (let j = i + 1; j < entries.length; j++) {
      if (!active[j]) continue;

      // Skip exact duplicates (already handled above)
      if (norms[i] === norms[j]) continue;

      // Near duplicate: edit distance <= 2 for names of reasonable length
      // or same letters in different order (reversed parts)
      if (norms[i].length >= 5 && norms[j].length >= 5) {
        const dist = editDistance(norms[i], norms[j]);
        const maxLen = Math.max(norms[i].length, norms[j].length);
        // Allow 1-2 edits for short names, up to ~8% difference for longer names
        const threshold = maxLen <= 10 ? 2 : Math.ceil(maxLen * 0.08);

        if (dist > 0 && dist <= threshold) {
          if (!entries[i].issues.includes('neardupe') && !entries[i].issues.includes('duplicate')) {
            entries[i].issues.push('neardupe');
            entries[i].details.push('Similar to row ' + (j + 1) + ' ("' + entries[j].current + '")');
          }
          if (!entries[j].issues.includes('neardupe') && !entries[j].issues.includes('duplicate')) {
            entries[j].issues.push('neardupe');
            entries[j].details.push('Similar to row ' + (i + 1) + ' ("' + entries[i].current + '")');
          }
        }
      }
    }
  }
}

// ========== LIST-CONTEXT ANALYSIS ==========
// These checks use the full list to find issues that can't be detected per-name

function markListContext() {
  const active = entries.filter(e => !e.dismissed);
  if (active.length < 3) return; // need enough names for context

  // --- 1. FORMAT CONSISTENCY ---
  // Detect the dominant format and flag outliers
  let commaCount = 0, normalCount = 0;
  active.forEach(e => {
    if (/^[A-Za-z\u00C0-\u024F'-]+\s*,/.test(e.current)) commaCount++;
    else normalCount++;
  });
  const dominantIsComma = commaCount > normalCount && commaCount >= 3;
  const dominantIsNormal = normalCount > commaCount && normalCount >= 3;
  // Only flag if there's a strong majority (>80%)
  const total = commaCount + normalCount;
  if (dominantIsNormal && commaCount > 0 && commaCount / total < 0.2) {
    active.forEach(e => {
      if (/^[A-Za-z\u00C0-\u024F'-]+\s*,/.test(e.current) && !e.issues.includes('listformat')) {
        e.issues.push('listformat');
        e.details.push('Uses "Last, First" format but ' + Math.round(normalCount/total*100) + '% of list uses "First Last"');
      }
    });
  }
  if (dominantIsComma && normalCount > 0 && normalCount / total < 0.2) {
    active.forEach(e => {
      if (!/^[A-Za-z\u00C0-\u024F'-]+\s*,/.test(e.current) && !e.issues.includes('listformat')) {
        e.issues.push('listformat');
        e.details.push('Uses "First Last" format but ' + Math.round(commaCount/total*100) + '% of list uses "Last, First"');
      }
    });
  }

  // Case consistency: if >80% are title case and some are all-lower or all-upper
  let titleCount = 0, otherCaseCount = 0;
  active.forEach(e => {
    const parts = e.current.split(/\s+/).filter(p => p.length > 1 && !SINGLE_PARTICLES.has(p.toLowerCase()));
    if (parts.length > 0 && parts.every(p => p[0] === p[0].toUpperCase() && p.slice(1) !== p.slice(1).toUpperCase())) {
      titleCount++;
    } else if (parts.length > 0) {
      otherCaseCount++;
    }
  });
  // Don't add listformat if already flagged for caps (redundant)

  // --- 2. SWAPPED-NAME CROSS-REFERENCE ---
  // If "John Smith" and "Smith John" both appear, flag the less common ordering
  const nameNorm = new Map(); // normalized "first last" → entry index
  active.forEach(e => {
    const parts = e.current.trim().split(/\s+/).filter(p => !SINGLE_PARTICLES.has(p.toLowerCase()));
    if (parts.length === 2) {
      const key = parts.map(p => p.toLowerCase()).join(' ');
      const rev = parts.map(p => p.toLowerCase()).reverse().join(' ');
      if (nameNorm.has(rev)) {
        const otherIdx = nameNorm.get(rev);
        const other = entries[otherIdx];
        // Flag both, but with different messages
        if (!e.issues.includes('listswapped')) {
          e.issues.push('listswapped');
          e.details.push('Reversed version exists: "' + other.current + '" (row ' + (otherIdx + 1) + ')');
        }
        if (!other.issues.includes('listswapped')) {
          other.issues.push('listswapped');
          other.details.push('Reversed version exists: "' + e.current + '" (row ' + (e.id + 1) + ')');
        }
      }
      if (!nameNorm.has(key)) nameNorm.set(key, e.id);
    }
  });
}


// ========== SUGGESTION ENGINE ==========

function suggestFix(name) {
  let fixed = name.trim();
  if (!fixed) return '';

  // Strip CSV-style wrapping quotes and normalize tabs
  fixed = fixed.replace(/^"|"$/g, '').replace(/\t/g, ' ');

  // Strip titles/honorifics
  const TITLE_RE = /^(mr|mrs|ms|miss|dr|prof|sir|lady|rev|father|mother|fr|sr|sra|herr|frau|senor|senora|hon|judge|captain|capt|sgt|cpl|pvt|lt|col|maj|gen|adm)\.\s+/i;
  fixed = fixed.replace(TITLE_RE, '');

  // Handle "Last, First" format -> "First Last"
  const commaMatch = fixed.match(/^([A-Za-z\u00C0-\u024F'-]+)\s*,\s*(.+)$/);
  if (commaMatch) {
    fixed = commaMatch[2].trim() + ' ' + commaMatch[1].trim();
  }

  // Remove numbers
  fixed = fixed.replace(/[0-9]/g, '');

  // Remove clearly invalid characters but keep apostrophes, hyphens, periods, parens, accented
  fixed = fixed.replace(/[<>@#$%^&*=+{}\[\]|\\~`]/g, '');

  // Normalize spacing
  fixed = fixed.replace(/\s+/g, ' ').trim();

  // Smart title case
  fixed = smartTitleCase(fixed);

  // Normalize diacritics/accented characters to English equivalents
  fixed = fixed.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/ø/g,'o').replace(/Ø/g,'O')
    .replace(/æ/g,'ae').replace(/Æ/g,'Ae')
    .replace(/ß/g,'ss')
    .replace(/ð/g,'d').replace(/Ð/g,'D')
    .replace(/þ/g,'th').replace(/Þ/g,'Th')
    .replace(/ł/g,'l').replace(/Ł/g,'L')
    .replace(/đ/g,'d').replace(/Đ/g,'D');

  // Reversed name fix — preserve particles (de, van, al, etc.)
  const parts = fixed.split(' ');
  const nonParticle = parts.filter(p => !SINGLE_PARTICLES.has(p.toLowerCase()));
  if (nonParticle.length >= 2 && !/,/.test(name)) {
    const first = nonParticle[0].toLowerCase();
    const last = nonParticle[nonParticle.length - 1].toLowerCase();

    // Classic reversal: "Smith John" -> "John Smith"
    // Or: "Cruz de la Maria" -> "Maria de la Cruz" (preserving particles)
    if ((COMMON_LAST.has(first) && COMMON_FIRST.has(last) && !COMMON_FIRST.has(first)) ||
        (FAMILY_FIRST_SURNAMES.has(first) && !nonParticle.slice(1).every(p => FAMILY_FIRST_SURNAMES.has(p.toLowerCase())))) {
      // Find the first non-particle token and move it to the end, keeping everything else in order
      const firstNPIdx = parts.findIndex(p => !SINGLE_PARTICLES.has(p.toLowerCase()));
      if (firstNPIdx >= 0) {
        const moved = parts.splice(firstNPIdx, 1)[0];
        parts.push(moved);
        fixed = parts.join(' ');
      }
    }
  }

  // Compare against normalized original to avoid suggesting no-op changes
  const normalized = name.replace(/^"|"$/g, '').replace(/\t/g, ' ').replace(/\s+/g, ' ').trim();
  return fixed === normalized ? '' : fixed;
}

function smartTitleCase(name) {
  const tokens = name.split(' ');
  return tokens.map((token, idx) => {
    const lo = token.toLowerCase();

    // Preserve parenthetical nicknames
    if (token.startsWith('(') && token.endsWith(')')) {
      const inner = token.slice(1, -1);
      return '(' + titleWord(inner) + ')';
    }

    // Keep suffixes in proper form
    if (SUFFIXES.has(lo)) {
      if (['i','ii','iii','iv','v','vi','vii','viii'].includes(lo)) return token.toUpperCase();
      return lo.charAt(0).toUpperCase() + lo.slice(1);
    }

    // Particles stay lowercase unless they start the name
    if (SINGLE_PARTICLES.has(lo) && idx > 0) return lo;

    // Handle "al-" prefix
    if (lo.startsWith('al-') && token.length > 3) {
      return 'Al-' + titleWord(token.slice(3));
    }
    if (lo.startsWith('el-') && token.length > 3) {
      return 'El-' + titleWord(token.slice(3));
    }

    return titleWord(token);
  }).join(' ');
}

function titleWord(s) {
  if (s.length === 0) return s;

  // Handle hyphenated names: Jean-Pierre, Adjei-Toure
  if (s.includes('-')) {
    return s.split('-').map(titleWord).join('-');
  }

  // Handle apostrophe names: O'Brien, N'Dour, D'Arcy, Sant'Anna
  const apoIdx = s.indexOf("'");
  if (apoIdx >= 0 && apoIdx < s.length - 1) {
    const before = s.slice(0, apoIdx);
    const after = s.slice(apoIdx + 1);
    if (before.length <= 2) {
      // O'Brien, N'Dour, D'Arcy style
      return titleWord(before) + "'" + titleWord(after);
    }
    // Sant'Anna style
    return titleWord(before) + "'" + titleWord(after);
  }

  const lo = s.toLowerCase();

  // Mc prefix: McDonald, McBride (need at least 3 chars)
  if (lo.startsWith('mc') && s.length > 2) {
    return 'Mc' + (s[2] || '').toUpperCase() + s.slice(3).toLowerCase();
  }

  // Mac prefix: only if original had internal cap (MacArthur) to avoid overcorrecting (Macula)
  if (lo.startsWith('mac') && s.length > 3) {
    const orig3 = s[3];
    if (orig3 && orig3 === orig3.toUpperCase() && orig3 !== orig3.toLowerCase()) {
      return 'Mac' + s[3].toUpperCase() + s.slice(4).toLowerCase();
    }
  }

  // Preserve camelCase name prefixes: DiMasi, DeLuca, LaForge, LeBron, DeWitt, etc.
  const camelPrefixes = ['di','de','la','le','lo','du','da'];
  for (const prefix of camelPrefixes) {
    if (lo.startsWith(prefix) && s.length > prefix.length) {
      const afterPrefix = s[prefix.length];
      if (afterPrefix && afterPrefix === afterPrefix.toUpperCase() && afterPrefix !== afterPrefix.toLowerCase()) {
        return prefix[0].toUpperCase() + prefix.slice(1) + afterPrefix.toUpperCase() + s.slice(prefix.length + 1).toLowerCase();
      }
    }
  }

  // If already capitalized and has intentional internal caps we don't recognize,
  // preserve original casing (e.g. InJoo, SunHee, JiYeon, DeAndre).
  // BUT skip if the whole word is uppercase (e.g. JOHNSON should still become Johnson)
  if (s !== s.toUpperCase() && s[0] === s[0].toUpperCase() && s.length > 2 &&
      s.slice(1).split('').some(c => c === c.toUpperCase() && c !== c.toLowerCase())) {
    return s;
  }

  return s[0].toUpperCase() + s.slice(1).toLowerCase();
}


// ========== RENDERING ==========

function render() {
  const tbody = document.getElementById('resultsBody');
  const filtered = entries.filter(e => {
    if (e.dismissed) return false;
    if (activeFilter === 'all') return true;
    if (activeFilter === 'issues') return e.issues.length > 0;
    if (activeFilter === 'clean') return e.issues.length === 0;
    return e.issues.includes(activeFilter);
  });

  const total = entries.filter(e => !e.dismissed).length;
  const withIssues = entries.filter(e => !e.dismissed && e.issues.length > 0).length;
  const dismissedCount = entries.filter(e => e.dismissed).length;
  document.getElementById('stats').innerHTML =
    `<span><strong>${total}</strong> names</span>` +
    `<span><strong>${withIssues}</strong> with issues</span>` +
    `<span><strong>${total - withIssues}</strong> clean</span>`;

  // Dismissed bar
  const dismissedBar = document.getElementById('dismissedBar');
  if (dismissedCount > 0) {
    dismissedBar.style.display = '';
    document.getElementById('dismissedCount').textContent = dismissedCount + ' dismissed name' + (dismissedCount > 1 ? 's' : '');
  } else {
    dismissedBar.style.display = 'none';
  }

  const issueCounts = {};
  entries.filter(e => !e.dismissed).forEach(e => {
    e.issues.forEach(iss => { issueCounts[iss] = (issueCounts[iss] || 0) + 1; });
  });

  let filterHTML = `<button class="filter-btn ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">All <span class="count">${total}</span></button>`;
  filterHTML += `<button class="filter-btn ${activeFilter==='issues'?'active':''}" onclick="setFilter('issues')">Issues <span class="count">${withIssues}</span></button>`;
  filterHTML += `<button class="filter-btn ${activeFilter==='clean'?'active':''}" onclick="setFilter('clean')">Clean <span class="count">${total - withIssues}</span></button>`;
  // Add separator and per-issue filters
  const issueKeys = Object.entries(ISSUE_TYPES).filter(([k]) => issueCounts[k]);
  if (issueKeys.length > 0) {
    filterHTML += `<div class="sep"></div>`;
    for (const [key, info] of issueKeys) {
      filterHTML += `<button class="filter-btn ${activeFilter===key?'active':''}" onclick="setFilter('${key}')">${info.label} <span class="count">${issueCounts[key]}</span></button>`;
    }
  }
  document.getElementById('filterBar').innerHTML = filterHTML;

  const colSpan = 7;
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${colSpan}" class="empty-state">No names match the current filter.</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(e => {
    const hasIssues = e.issues.length > 0;
    const rowClass = hasIssues ? '' : 'row-clean';

    const tags = e.issues.map((iss, idx) => {
      const info = ISSUE_TYPES[iss] || { label: iss, cls: 'tag-data' };
      const detail = e.details[idx] || '';
      return `<div><span class="tag ${info.cls}">${info.label}</span>${detail ? `<div class="issue-detail">${esc(detail)}</div>` : ''}</div>`;
    }).filter(Boolean).join('');

    // Compute highest confidence score across visible issues for this row
    let topScore = 0;
    if (hasIssues) {
      e.issues.forEach((iss, idx) => {
        const s = getConfidence(iss, e.details[idx] || '');
        if (s > topScore) topScore = s;
      });
    }
    const scoreCell = topScore > 0
      ? `<span style="color:${scoreColor(topScore)}">${topScore}</span>`
      : '';

    const suggestion = e.suggestion && !e.accepted
      ? `<span style="color:var(--success)">${esc(e.suggestion)}</span>`
      : (e.accepted ? `<span style="color:var(--text-muted);font-style:italic">Applied</span>` : `<span style="color:var(--text-muted)">\u2014</span>`);

    const actions = [];
    if (e.suggestion && !e.accepted) {
      actions.push(`<button class="btn-primary" onclick="acceptSuggestion(${e.id})">Accept</button>`);
    }
    if (hasIssues) {
      actions.push(`<button onclick="dismissEntry(${e.id})">Dismiss</button>`);
    }

    return `<tr class="${rowClass}">
      <td><span style="font-size:0.85rem;color:var(--text-muted)">${esc(e.fName || '')}</span></td>
      <td><span style="font-size:0.85rem;color:var(--text-muted)">${esc(e.lName || '')}</span></td>
      <td>
        <input class="name-input" data-id="${e.id}" value="${esc(e.current)}" onchange="updateName(${e.id}, this.value)" />
        ${e.current !== normalizeDisplay(e.original) ? `<div class="original-name">was: ${esc(normalizeDisplay(e.original))}</div>` : ''}
      </td>
      <td><div class="tags">${tags || '<span style="color:var(--success)">Clean</span>'}</div></td>
      <td>${suggestion}</td>
      <td><div class="action-btns">${actions.join('')}</div></td>
      <td class="conf-cell">${scoreCell}</td>
    </tr>`;
  }).join('');

  // Set input values via DOM to avoid HTML attribute escaping issues
  requestAnimationFrame(() => {
    tbody.querySelectorAll('input.name-input[data-id]').forEach(input => {
      const id = parseInt(input.dataset.id);
      if (entries[id]) input.value = entries[id].current;
    });
  });
}

function normalizeDisplay(s) {
  return s.replace(/\t/g, ' ').replace(/^"|"$/g, '').replace(/\s+/g, ' ').trim();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function setFilter(f) { activeFilter = f; render(); }


function updateName(id, value) {
  entries[id].current = value;
  entries[id].issues = detectIssues(value);
  entries[id].details = entries[id].issues.map(iss => issueDetail(iss, value));
  const NO_AUTOFIX = ['data', 'merged', 'truncated'];
  entries[id].suggestion = entries[id].issues.length > 0 && !entries[id].issues.some(i => NO_AUTOFIX.includes(i)) ? suggestFix(value) : '';
  stripContextIssues(); markDuplicates(); markListContext(); render();
}

function acceptSuggestion(id) {
  entries[id].current = entries[id].suggestion;
  entries[id].accepted = true;
  entries[id].issues = detectIssues(entries[id].current);
  entries[id].details = entries[id].issues.map(iss => issueDetail(iss, entries[id].current));
  entries[id].suggestion = suggestFix(entries[id].current);
  stripContextIssues();
  markDuplicates(); markListContext();
  render();
}

function dismissEntry(id) { entries[id].dismissed = true; render(); }

function undoAllDismissed() {
  entries.forEach(e => { e.dismissed = false; });
  stripContextIssues();
  markDuplicates(); markListContext();
  render();
}

function acceptAllSuggestions() {
  entries.forEach(e => {
    if (e.suggestion && !e.accepted && !e.dismissed) {
      e.current = e.suggestion;
      e.accepted = true;
      e.issues = detectIssues(e.current);
      e.details = e.issues.map(iss => issueDetail(iss, e.current));
      e.suggestion = suggestFix(e.current);
    }
  });
  stripContextIssues();
  markDuplicates(); markListContext();
  render();
}

// Helper: strip list-context issues (duplicates, cross-ref) and their details
const CONTEXT_ISSUES = new Set(['duplicate','neardupe','listformat','listswapped','xfield_missing','xfield_mismatch','xfield_swapped','xfield_extra']);
function stripContextIssues() {
  entries.forEach(e => {
    const keep = [];
    const keepDetails = [];
    for (let i = 0; i < e.issues.length; i++) {
      if (!CONTEXT_ISSUES.has(e.issues[i])) {
        keep.push(e.issues[i]);
        keepDetails.push(e.details[i]);
      }
    }
    e.issues = keep;
    e.details = keepDetails;
  });
}


// ========== EXPORT ==========

// Extract surname for sorting: last significant word (skip suffixes like Jr, II, III)
function getSurname(name) {
  if (!name) return '';
  const parts = name.trim().split(/\s+/);
  // Walk backwards to find the last non-suffix, non-particle word
  for (let i = parts.length - 1; i >= 0; i--) {
    const lo = parts[i].toLowerCase().replace(/\./g, '');
    if (!SUFFIXES.has(lo)) return parts[i];
  }
  return parts[parts.length - 1] || name;
}

function sortBySurname(names) {
  return [...names].sort((a, b) => {
    const sa = getSurname(a).toLowerCase();
    const sb = getSurname(b).toLowerCase();
    if (sa !== sb) return sa.localeCompare(sb, undefined, { sensitivity: 'base' });
    return a.localeCompare(b, undefined, { sensitivity: 'base' });
  });
}

function threeColumnLayout(names) {
  const rows = Math.ceil(names.length / 3);
  const col1 = names.slice(0, rows);
  const col2 = names.slice(rows, rows * 2);
  const col3 = names.slice(rows * 2);
  const w1 = Math.max(...col1.map(n => n.length), 0);
  const w2 = Math.max(...(col2.length ? col2.map(n => n.length) : [0]), 0);
  const lines = [];
  for (let i = 0; i < rows; i++) {
    const c1 = (col1[i] || '').padEnd(w1 + 4);
    const c2 = (col2[i] || '').padEnd(w2 + 4);
    const c3 = col3[i] || '';
    lines.push((c1 + c2 + c3).trimEnd());
  }
  return lines;
}

function exportTxt() {
  const names = sortBySurname(entries.filter(e => !e.dismissed).map(e => e.current));
  download(threeColumnLayout(names).join('\n'), 'cleaned-names.txt', 'text/plain');
}

function exportCSV() {
  const names = sortBySurname(entries.filter(e => !e.dismissed).map(e => e.current));
  const csvRows = [];
  // Fill left-to-right, three names per row (row-major order)
  for (let i = 0; i < names.length; i += 3) {
    const c1 = names[i] || '';
    const c2 = names[i + 1] || '';
    const c3 = names[i + 2] || '';
    csvRows.push(`"${c1.replace(/"/g,'""')}","${c2.replace(/"/g,'""')}","${c3.replace(/"/g,'""')}"`);
  }
  download(csvRows.join('\n'), 'cleaned-names.csv', 'text/csv');
}

function copyToClipboard(btn) {
  const names = entries.filter(e => !e.dismissed).map(e => e.current).join('\n');
  navigator.clipboard.writeText(names).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// ========== FILE DROP & LOAD ==========

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  readFile(file);
  event.target.value = ''; // reset so same file can be loaded again
}

function readFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    document.getElementById('nameInput').value = text;
  };
  reader.readAsText(file);
}

// Drag and drop
(function() {
  const zone = document.getElementById('dropZone');
  const overlay = document.getElementById('dropOverlay');
  let dragCounter = 0;

  zone.addEventListener('dragenter', function(e) {
    e.preventDefault();
    dragCounter++;
    overlay.style.display = 'flex';
  });

  zone.addEventListener('dragleave', function(e) {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) { overlay.style.display = 'none'; dragCounter = 0; }
  });

  zone.addEventListener('dragover', function(e) {
    e.preventDefault();
  });

  zone.addEventListener('drop', function(e) {
    e.preventDefault();
    dragCounter = 0;
    overlay.style.display = 'none';
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  });
})();
